<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Quản Lý Thi Công - Bể XLNT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Include Alpine.js for lightweight reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Thư viện hỗ trợ xuất PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#1e40af', // blue-800
                        secondary: '#3b82f6', // blue-500
                        accent: '#f59e0b', // amber-500
                        background: '#f3f4f6', // gray-100
                        surface: '#ffffff',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
        /* Subdued input fields */
        input[type="text"], input[type="date"], input[type="number"], textarea {
            transition: all 0.2s ease;
        }
        input[type="text"]:focus, input[type="date"]:focus, input[type="number"]:focus, textarea:focus {
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
            outline: none;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-background text-gray-800 font-sans h-screen flex flex-col overflow-hidden" 
      x-data="constructionApp()">

    <header class="bg-primary text-white shadow-md z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-hard-hat text-2xl text-accent"></i>
                <h1 class="text-xl font-bold tracking-wide">QL Thi Công Hằng Ngày</h1>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Controls & Filters -->
        <div class="mb-6 flex flex-wrap gap-4 items-center justify-between bg-surface p-4 rounded-xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-2">
                <label class="text-sm font-semibold text-gray-600">Hạng mục:</label>
                <select x-model="category" class="border-gray-300 rounded-md shadow-sm text-sm focus:ring-secondary focus:border-secondary p-2 bg-gray-50">
                    <option value="Bể xử lý nước thải">Bể xử lý nước thải</option>
                    <option value="Hố thu gom">Hố thu gom</option>
                    <option value="Nhà điều hành">Nhà điều hành</option>
                </select>
            </div>
            
            <div class="flex gap-2">
                <button @click="saveData()" class="bg-secondary hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm">
                    <i class="fas fa-save"></i> Lưu Dữ Liệu
                </button>
                <button @click="exportReport()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm">
                    <i class="fas fa-file-download"></i> Tải Báo Cáo
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left Column: Report & Support -->
            <div class="lg:col-span-1 space-y-6">
                
                <!-- Today's Report Card -->
                <div class="bg-surface rounded-xl shadow-md overflow-hidden border border-gray-200">
                    <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex items-center justify-between">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <i class="fas fa-clipboard-list text-secondary"></i> Báo Cáo Hôm Nay
                        </h2>
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800">25/09/2026</span>
                    </div>
                    <div class="p-5 space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Vị trí thi công</label>
                            <input type="text" x-model="report.location" class="w-full text-sm border-gray-300 rounded-md p-2 bg-gray-50 border">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Nội dung công việc</label>
                            <textarea x-model="report.content" rows="3" class="w-full text-sm border-gray-300 rounded-md p-2 bg-gray-50 border resize-none"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Tổ đội</label>
                                <input type="text" x-model="report.team" class="w-full text-sm border-gray-300 rounded-md p-2 bg-gray-50 border">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Nhân lực (người)</label>
                                <input type="number" x-model="report.manpower" class="w-full text-sm border-gray-300 rounded-md p-2 bg-gray-50 border">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Thiết bị, vật tư chính</label>
                            <input type="text" x-model="report.equipment" class="w-full text-sm border-gray-300 rounded-md p-2 bg-gray-50 border">
                        </div>
                    </div>
                </div>

                <!-- Support Request Card -->
                <div class="bg-surface rounded-xl shadow-md overflow-hidden border border-amber-200">
                    <div class="bg-amber-50 px-5 py-3 border-b border-amber-200">
                        <h2 class="text-lg font-bold text-amber-900 flex items-center gap-2">
                            <i class="fas fa-hands-helping text-accent"></i> Đề Xuất Hỗ Trợ
                        </h2>
                    </div>
                    <div class="p-5 space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-1">Nội dung yêu cầu</label>
                            <div class="flex items-center gap-2">
                                <span class="text-sm">Cần bố trí</span>
                                <input type="number" x-model="support.workers" class="w-16 text-sm border-gray-300 rounded-md p-1 bg-gray-50 border text-center">
                                <span class="text-sm">công nhật hỗ trợ</span>
                            </div>
                            <input type="text" x-model="support.task" placeholder="VD: bơm nước..." class="mt-2 w-full text-sm border-gray-300 rounded-md p-2 bg-gray-50 border">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Từ ngày</label>
                                <input type="date" x-model="support.startDate" class="w-full text-sm border-gray-300 rounded-md p-2 bg-gray-50 border">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-gray-500 mb-1">Đến ngày</label>
                                <input type="date" x-model="support.endDate" class="w-full text-sm border-gray-300 rounded-md p-2 bg-gray-50 border">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle/Right Column: Schedule & Tomorrow's Plan -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Progress Schedule Card -->
                <div class="bg-surface rounded-xl shadow-md overflow-hidden border border-gray-200 flex flex-col h-[500px]">
                    <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <i class="fas fa-tasks text-secondary"></i> Bảng Tiến Độ Dự Kiến
                        </h2>
                        <button @click="addScheduleTask()" class="text-sm text-secondary hover:text-blue-700 font-medium">
                            <i class="fas fa-plus-circle"></i> Thêm đầu việc
                        </button>
                    </div>
                    
                    <div class="flex-1 overflow-auto p-0">
                        <table class="w-full text-sm text-left whitespace-nowrap">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-100 sticky top-0 shadow-sm z-10">
                                <tr>
                                    <th scope="col" class="px-4 py-3 w-12 text-center">STT</th>
                                    <th scope="col" class="px-4 py-3">Công tác thi công / Nghiệm thu</th>
                                    <th scope="col" class="px-4 py-3 w-40">Thời gian (Ngày & Giờ)</th>
                                    <th scope="col" class="px-4 py-3 w-32">Trạng thái</th>
                                    <th scope="col" class="px-4 py-3 w-16"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <template x-for="(task, index) in schedule" :key="task.id">
                                    <tr class="border-b border-gray-100 hover:bg-blue-50 transition-colors"
                                        :class="{'bg-gray-50 font-semibold': task.isMainPhase}">
                                        
                                        <!-- STT -->
                                        <td class="px-4 py-3 text-center text-gray-500 font-medium">
                                            <input type="text" x-model="task.order" class="w-10 text-center bg-transparent border-transparent hover:border-gray-300 focus:border-secondary rounded p-1">
                                        </td>
                                        
                                        <!-- Task Name -->
                                        <td class="px-4 py-2">
                                            <div class="flex items-center gap-2" :class="{'pl-4': !task.isMainPhase}">
                                                <template x-if="task.isMilestone">
                                                    <i class="fas fa-flag-checkered text-accent"></i>
                                                </template>
                                                <input type="text" x-model="task.name" 
                                        <!-- Date & Time -->
                                        <td class="px-4 py-2">
                                            <div class="flex flex-col gap-1">
                                                <input type="date" x-model="task.date" 
                                                       class="w-full text-xs bg-transparent border-transparent hover:border-gray-300 focus:border-secondary rounded p-1">
                                                <input type="time" x-model="task.time" 
                                                       class="w-full text-xs text-gray-600 bg-transparent border-transparent hover:border-gray-300 focus:border-secondary rounded p-1"
                                                       title="Giờ thực hiện">
                                            </div>
                                        </td>
                                        
                                        <!-- Status -->
                                        <td class="px-4 py-2">
                                            <select x-model="task.status" 
                                                    class="w-full text-xs rounded border-gray-300 p-1"
                                                    :class="{
                                                        'bg-green-100 text-green-800 border-green-200': task.status === 'Hoàn thành',
                                                        'bg-blue-100 text-blue-800 border-blue-200': task.status === 'Đang thi công',
                                                        'bg-gray-100 text-gray-600 border-gray-200': task.status === 'Chưa bắt đầu',
                                                        'hidden': task.isMainPhase && task.subTasksCount > 0 // hide status for main phase if it has subtasks
                                                    }">
                                                <option value="Chưa bắt đầu">Chưa bắt đầu</option>
                                                <option value="Đang thi công">Đang thi công</option>
                                                <option value="Hoàn thành">Hoàn thành</option>
                                            </select>
                                        </td>
                                        
                                        <!-- Actions -->
                                        <td class="px-4 py-2 text-center">
                                            <button @click="removeScheduleTask(task.id)" class="text-red-400 hover:text-red-600 transition-colors" title="Xóa">
                                                <i class="fas fa-trash-alt"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Tomorrow's Plan Card -->
                <div class="bg-surface rounded-xl shadow-md overflow-hidden border border-gray-200">
                    <div class="bg-gray-50 px-5 py-3 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <i class="fas fa-forward text-secondary"></i> Kế Hoạch Ngày Mai
                        </h2>
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-purple-100 text-purple-800">26/09/2026</span>
                    </div>
                    
                    <div class="p-5 grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <!-- Tasks List -->
                        <div class="space-y-3">
                            <div class="flex justify-between items-center mb-2">
                                <label class="text-xs font-medium text-gray-500 uppercase tracking-wider">Danh sách công việc</label>
                                <button @click="addTomorrowTask()" class="text-xs text-secondary hover:underline"><i class="fas fa-plus"></i> Thêm</button>
                            </div>
                            
                            <ul class="space-y-2">
                                <template x-for="(plan, index) in tomorrowPlan.tasks" :key="index">
                                    <li class="flex items-start gap-2 group">
                                        <span class="text-secondary mt-1">•</span>
                                        <textarea x-model="tomorrowPlan.tasks[index]" rows="2" 
                                                  class="flex-1 text-sm border-transparent hover:border-gray-300 focus:border-secondary focus:ring-0 rounded bg-gray-50 p-1 resize-none transition-colors w-full"></textarea>
                                        <button @click="removeTomorrowTask(index)" class="text-gray-300 hover:text-red-500 mt-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </li>
                                </template>
                            </ul>
                        </div>
                        
                        <!-- Resources Plan -->
                        <div class="space-y-4 bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider border-b border-gray-200 pb-2 mb-3">Dự kiến nguồn lực</label>
                            
                            <div class="flex items-center gap-3">
                                <i class="fas fa-users text-gray-400 w-5 text-center"></i>
                                <span class="text-sm text-gray-600 w-24">Nhân lực:</span>
                                <input type="number" x-model="tomorrowPlan.manpower" placeholder="Số lượng" class="w-20 text-sm border-gray-300 rounded p-1 text-center">
                                <span class="text-sm text-gray-500">người</span>
                            </div>
                            
                            <div class="flex items-center gap-3">
                                <i class="fas fa-chart-line text-gray-400 w-5 text-center"></i>
                                <span class="text-sm text-gray-600 w-24">Khối lượng:</span>
                                <input type="text" x-model="tomorrowPlan.volume" placeholder="Dự kiến hoàn thành..." class="flex-1 text-sm border-gray-300 rounded p-1">
                            </div>
                            
                            <div class="flex items-start gap-3 pt-2">
                                <i class="fas fa-tools text-gray-400 w-5 text-center mt-1"></i>
                                <span class="text-sm text-gray-600 w-24 mt-1">Vật tư bổ sung:</span>
                                <textarea x-model="tomorrowPlan.materials" rows="2" placeholder="Thiết bị, vật tư cần chuẩn bị..." class="flex-1 text-sm border-gray-300 rounded p-1 resize-none"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </main>

    <!-- Notification Toast -->
    <div x-show="showToast" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="transform translate-y-10 opacity-0"
         x-transition:enter-end="transform translate-y-0 opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="transform translate-y-0 opacity-100"
         x-transition:leave-end="transform translate-y-10 opacity-0"
         class="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50"
         style="display: none;">
        <i class="fas fa-check-circle text-green-400 text-xl"></i>
        <div>
            <h4 class="font-bold text-sm" x-text="toastTitle"></h4>
            <p class="text-xs text-gray-300" x-text="toastMessage"></p>
        </div>
    </div>

    <script>
        function constructionApp() {
            return {
                // State variables
                todayDate: '',
                currentTime: '',
                category: 'Bể xử lý nước thải',
                showToast: false,
                toastTitle: '',
                toastMessage: '',
                
                // Data models initialized from the provided text
                report: {
                    location: 'Thi công nắp bể, trục VD (X1–X4/Y1–Y5).',
                    content: 'Lắp dựng cốp pha vách bể và cốp pha nắp bể tại khu vực thi công.',
                    team: 'Mr. Nam',
                    manpower: 5,
                    equipment: '01 máy hàn, máy khoan, ván, xà gồ, cây chống.'
                },
                
                support: {
                    workers: '',
                    task: 'xử lý rò rỉ nước ở thành bể.',
                    startDate: '',
                    endDate: ''
                },
                
                tomorrowPlan: {
                    tasks: [
                        'Tiếp tục lắp dựng cốp pha vách bể và cốp pha nắp bể tại các vị trí còn lại.',
                        'Hoàn thiện hệ xà gồ, cây chống và các liên kết cốp pha.',
                        'Kiểm tra tim trục, cao độ, kích thước và độ kín khít cốp pha theo bản vẽ.',
                        'Bơm nước, vệ sinh khu vực thi công.',
                        'Chuẩn bị nghiệm thu phần cốp pha hoàn thành để bàn giao thi công cốt thép.'
                    ],
                    manpower: '',
                    volume: '',
                    materials: ''
                },
                
                schedule: [
                    { id: 1, order: '1', name: 'Lắp dựng cốp pha', date: '2026-09-25', time: '', status: 'Đang thi công', isMainPhase: true, isMilestone: false, subTasksCount: 4 },
                    { id: 2, order: '1.1', name: 'Hoàn thành cốp pha vách bể', date: '', time: '', status: 'Chưa bắt đầu', isMainPhase: false, isMilestone: false },
                    { id: 3, order: '1.2', name: 'Hoàn thành cốp pha nắp bể', date: '', time: '', status: 'Chưa bắt đầu', isMainPhase: false, isMilestone: false },
                    { id: 4, order: '1.3', name: 'Vệ sinh khu vực thi công', date: '', time: '', status: 'Chưa bắt đầu', isMainPhase: false, isMilestone: false },
                    { id: 5, order: '1.4', name: 'Nghiệm thu cốp pha, hệ cây chống', date: '', time: '14:30', status: 'Chưa bắt đầu', isMainPhase: false, isMilestone: true },
                    { id: 6, order: '2', name: 'Thi công cốt thép', date: '', time: '', status: 'Chưa bắt đầu', isMainPhase: true, isMilestone: false, subTasksCount: 3 },
                    { id: 7, order: '2.1', name: 'Bàn giao mặt bằng thi công cốt thép', date: '', time: '', status: 'Chưa bắt đầu', isMainPhase: false, isMilestone: false },
                    { id: 8, order: '2.2', name: 'Gia công & lắp dựng cốt thép', date: '', time: '', status: 'Chưa bắt đầu', isMainPhase: false, isMilestone: false },
                    { id: 9, order: '2.3', name: 'Nghiệm thu cốt thép', date: '', time: '', status: 'Chưa bắt đầu', isMainPhase: false, isMilestone: true },
                    { id: 10, order: '3', name: 'Đổ bê tông', date: '', time: '', status: 'Chưa bắt đầu', isMainPhase: true, isMilestone: true, subTasksCount: 0 }
                ],
                
                // Methods
                init() {
                    // Chạy ngay khi ứng dụng khởi tạo
                    this.updateDateTime();
                    // Cập nhật thời gian mỗi giây (1000ms)
                    setInterval(() => this.updateDateTime(), 1000);
                },
                
                updateDateTime() {
                    const now = new Date();
                    const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
                    const dayName = days[now.getDay()];
                    const dd = String(now.getDate()).padStart(2, '0');
                    const mm = String(now.getMonth() + 1).padStart(2, '0');
                    const yyyy = now.getFullYear();
                    this.todayDate = `${dayName}, ${dd}/${mm}/${yyyy}`;
                    
                    const hh = String(now.getHours()).padStart(2, '0');
                    const min = String(now.getMinutes()).padStart(2, '0');
                    const ss = String(now.getSeconds()).padStart(2, '0');
                    this.currentTime = `${hh}:${min}:${ss}`;
                },

                addTomorrowTask() {
                    this.tomorrowPlan.tasks.push('');
                },
                
                removeTomorrowTask(index) {
                    this.tomorrowPlan.tasks.splice(index, 1);
                },
                
                addScheduleTask() {
                    const newId = this.schedule.length > 0 ? Math.max(...this.schedule.map(t => t.id)) + 1 : 1;
                    this.schedule.push({
                        id: newId,
                        order: '...',
                        name: 'Công việc mới',
                        date: '',
                        time: '',
                        status: 'Chưa bắt đầu',
                        isMainPhase: false,
                        isMilestone: false
                    });
                },
                
                removeScheduleTask(id) {
                    this.schedule = this.schedule.filter(t => t.id !== id);
                },
                
                triggerToast(title, message) {
                    this.toastTitle = title;
                    this.toastMessage = message;
                    this.showToast = true;
                    setTimeout(() => {
                        this.showToast = false;
                    }, 3000);
                },
                
                saveData() {
                    console.log("Data saved locally");
                    this.triggerToast('Lưu thành công', 'Dữ liệu đã được cập nhật.');
                },
                
                exportReport() {
                    this.triggerToast('Đang xử lý...', 'Đang tạo báo cáo PDF...');

                    // Tạo một phần tử HTML ẩn để render PDF
                    const reportElement = document.createElement('div');
                    
                    // Render các dòng của bảng tiến độ
                    let scheduleRows = '';
                    this.schedule.forEach(task => {
                        let isBold = task.isMainPhase ? 'font-weight: bold;' : '';
                        let dateStr = task.date ? new Date(task.date).toLocaleDateString('vi-VN') : '';
                        let timeStr = task.time ? task.time : '';
                        let dateTimeStr = [timeStr, dateStr].filter(Boolean).join(' - '); // Nối giờ và ngày
                        
                        scheduleRows += `
                            <tr>
                                <td style="border: 1px solid #333; padding: 8px; text-align: center; ${isBold}">${task.order}</td>
                                <td style="border: 1px solid #333; padding: 8px; ${isBold}">${task.name}</td>
                                <td style="border: 1px solid #333; padding: 8px; text-align: center;">${dateTimeStr}</td>
                                <td style="border: 1px solid #333; padding: 8px; text-align: center;">${task.status}</td>
                            </tr>
                        `;
                    });

                    // Render danh sách công việc ngày mai
                    let tomorrowTasksList = '';
                    this.tomorrowPlan.tasks.forEach(task => {
                        if (task.trim() !== '') {
                            tomorrowTasksList += `<li style="margin-bottom: 6px;">${task}</li>`;
                        }
                    });

                    // Cấu trúc HTML của file PDF
                    reportElement.innerHTML = `
                        <div style="padding: 20px 40px; font-family: 'Times New Roman', Times, serif; color: #000; line-height: 1.5;">
                            <div style="text-align: center; margin-bottom: 30px;">
                                <h1 style="font-size: 22px; margin-bottom: 5px; text-transform: uppercase;">BÁO CÁO CÔNG VIỆC THI CÔNG</h1>
                                <p style="font-style: italic; margin-top: 0;">Thời gian lập: ${this.currentTime} - ${this.todayDate}</p>
                            </div>
                            
                            <h2 style="font-size: 16px; border-bottom: 1px solid #000; padding-bottom: 5px; margin-top: 20px;">1. THÔNG TIN CHUNG</h2>
                            <div style="padding-left: 10px;">
                                <p style="margin: 5px 0;"><strong>Hạng mục:</strong> ${this.category}</p>
                                <p style="margin: 5px 0;"><strong>Vị trí:</strong> ${this.report.location}</p>
                                <p style="margin: 5px 0;"><strong>Nội dung:</strong> ${this.report.content}</p>
                                <p style="margin: 5px 0;"><strong>Tổ đội:</strong> ${this.report.team} - ${this.report.manpower || 0} người</p>
                                <p style="margin: 5px 0;"><strong>Thiết bị, vật tư:</strong> ${this.report.equipment}</p>
                            </div>
                            
                            <h2 style="font-size: 16px; border-bottom: 1px solid #000; padding-bottom: 5px; margin-top: 25px;">2. BẢNG TIẾN ĐỘ THI CÔNG DỰ KIẾN</h2>
                            <table style="width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px;">
                                <thead>
                                    <tr style="background-color: #f2f2f2;">
                                        <th style="border: 1px solid #333; padding: 8px; width: 10%;">STT</th>
                                        <th style="border: 1px solid #333; padding: 8px; width: 50%;">Công tác thi công</th>
                                        <th style="border: 1px solid #333; padding: 8px; width: 20%;">Thời gian</th>
                                        <th style="border: 1px solid #333; padding: 8px; width: 20%;">Trạng thái</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${scheduleRows}
                                </tbody>
                            </table>
                            
                            <h2 style="font-size: 16px; border-bottom: 1px solid #000; padding-bottom: 5px; margin-top: 25px;">3. KẾ HOẠCH NGÀY MAI</h2>
                            <div style="padding-left: 10px;">
                                <ul style="margin-top: 10px; padding-left: 20px;">
                                    ${tomorrowTasksList}
                                </ul>
                                <p style="margin: 5px 0;"><strong>Nhân lực dự kiến:</strong> ${this.tomorrowPlan.manpower || '...'} người.</p>
                                <p style="margin: 5px 0;"><strong>Khối lượng dự kiến:</strong> ${this.tomorrowPlan.volume || '...'}</p>
                                <p style="margin: 5px 0;"><strong>Vật tư bổ sung:</strong> ${this.tomorrowPlan.materials || '...'}</p>
                            </div>

                            <h2 style="font-size: 16px; border-bottom: 1px solid #000; padding-bottom: 5px; margin-top: 25px;">4. ĐỀ XUẤT HỖ TRỢ</h2>
                            <div style="padding-left: 10px;">
                                <p style="margin: 5px 0;"><strong>Nội dung:</strong> Cần bố trí ${this.support.workers || '...'} công nhật hỗ trợ ${this.support.task || '...'}</p>
                                <p style="margin: 5px 0;"><strong>Thời gian:</strong> Từ ${this.support.startDate ? new Date(this.support.startDate).toLocaleDateString('vi-VN') : '...'} đến ${this.support.endDate ? new Date(this.support.endDate).toLocaleDateString('vi-VN') : '...'}</p>
                            </div>
                        </div>
                    `;

                    // Cấu hình xuất PDF
                    const opt = {
                        margin:       [10, 0, 10, 0], // top, left, bottom, right
                        filename:     'Bao_Cao_Thi_Cong.pdf',
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2 },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };

                    // Thực hiện xuất bằng thư viện
                    html2pdf().set(opt).from(reportElement).save().then(() => {
                        this.triggerToast('Thành công', 'Đã tải xuống file báo cáo PDF');
                    }).catch(err => {
                        console.error('Lỗi khi xuất PDF:', err);
                        this.triggerToast('Lỗi', 'Không thể tạo file PDF. Vui lòng thử lại.');
                    });
                }
            }
        }
    </script>
</body>
</html>
